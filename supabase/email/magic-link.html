<!-- ARRAE sign-in email. Paste into Supabase: Authentication > Emails > Templates, for both "Magic Link" and "Confirm signup". -->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#faf8f5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf8f5;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e6e1d8;border-radius:12px;">
            <tr>
              <td style="padding:40px 40px 8px 40px;">
                <img src="https://arrae-portal.vercel.app/arrae-logo.png" alt="ARRAE" width="110" style="display:block;width:110px;height:auto;border:0;" />
              </td>
            </tr>
            <tr>
              <td style="padding:24px 40px 0 40px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-size:26px;line-height:1.25;color:#1f1d1a;">
                Your sign-in link
              </td>
            </tr>
            <tr>
              <td style="padding:12px 40px 0 40px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#6f6a62;">
                Click the button below to sign in to the ARRAE portal. The link works once and expires in an hour.
              </td>
            </tr>
            <tr>
              <td style="padding:28px 40px 8px 40px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1f1d1a;color:#ffffff;text-decoration:none;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;padding:12px 22px;border-radius:8px;">
                  Sign in to ARRAE
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 40px 40px 40px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#6f6a62;border-bottom:0;">
                Didn't ask for this? You can ignore this email; nobody can sign in without the link.
              </td>
            </tr>
          </table>
          <p style="margin:20px 0 0 0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#6f6a62;">
            ARRAE Gallery · <a href="https://arraegallery.com" style="color:#6f6a62;">arraegallery.com</a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
